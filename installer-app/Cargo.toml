[package]
name = "ferro-setup"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow"] }
rfd = "0.15"
flate2 = "1"

[build-dependencies]
winresource = "0.1"
flate2 = "1"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
