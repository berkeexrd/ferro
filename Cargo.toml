[package]
name = "ferro"
version = "0.1.0"
edition = "2021"
description = "Ferro - a fast, transparent and reversible Git client, drawn entirely in Rust"

[dependencies]
eframe = { version = "=0.31.1", default-features = false, features = ["glow", "accesskit"] }
egui_extras = { version = "=0.31.1", features = ["svg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
base64 = "0.22"
keyring = { version = "3", features = ["windows-native"] }
rfd = "0.15"
open = "5"
trash = "5"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"

[profile.dev]
opt-level = 1
[profile.dev.package."*"]
opt-level = 2

[build-dependencies]
winresource = "0.1"
